name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest
      - name: Run benchmark evaluation harness
        # Runs the eval harness and saves a report artifact.  Currently
        # non-blocking because the parser has known divergences (see
        # checkpoint.md CP44 / known-parser-divergences tests).  Once the
        # parser meets the quality thresholds, remove continue-on-error.
        continue-on-error: true
        run: |
          python -c "
          from tender_compliance_api.extraction.eval_harness import run_eval, format_text_report
          report = run_eval()
          text = format_text_report(report)
          with open('eval-report.txt', 'w') as f:
              f.write(text)
          print(text)
          print(f'ALL GATES PASSED: {report.all_passed}')
          "
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-eval-report
          path: eval-report.txt
      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit --requirement requirements.txt --requirement requirements-dev.txt 2>&1 || true
          # In CI, scan the installed project + all transitive deps:
          pip-audit 2>&1 || true
        continue-on-error: true

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
