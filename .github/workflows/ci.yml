name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tce_ci
          POSTGRES_USER: tce
          POSTGRES_PASSWORD: tce-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tce -d tce_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: PostgreSQL migration + enum smoke
        env:
          DATABASE_URL: postgresql+asyncpg://tce:tce-password@localhost:5432/tce_ci
        run: |
          alembic -c alembic.ini upgrade head
          python - <<'PY'
          import asyncio
          import os

          from tender_compliance_api.db.models import Organization, Project, ProjectStatus
          from tender_compliance_api.db.session import close_engine, get_session, init_engine

          async def main() -> None:
              init_engine(os.environ["DATABASE_URL"])
              async for session in get_session():
                  org = Organization(name="CI PostgreSQL Smoke")
                  session.add(org)
                  await session.flush()
                  project = Project(
                      organization_id=org.id,
                      name="Enum serialization smoke",
                      status=ProjectStatus.DRAFT,
                  )
                  session.add(project)
                  await session.commit()
                  assert project.status == ProjectStatus.DRAFT
                  break
              await close_engine()

          asyncio.run(main())
          PY
      - run: ruff check .
      - run: pytest
      - name: Run benchmark evaluation harness — critical quality gates
        # Critical gates (invented-negative rate = 0, numeric fidelity = 0)
        # are BLOCKING — they guard against fabricated requirements and wrong
        # citations.  The aggregate F1 gate remains non-blocking because recall
        # is bounded by inherent deterministic-parser limitations (no bare-number
        # fabrication, no table-layout analysis, per-requirement rather than
        # cross-requirement context).  F1 is monitored in the eval report
        # artifact but does not block merge.  See docs/checkpoint.md CP48.
        run: |
          python -c "
          from tender_compliance_api.extraction.eval_harness import run_eval, format_text_report, check_quality_gates
          report = run_eval()
          text = format_text_report(report)
          with open('eval-report.txt', 'w') as f:
              f.write(text)
          print(text)
          print(f'CRITICAL GATES PASSED: {report.critical_gates_passed}')
          print(f'ALL GATES PASSED: {report.all_passed}')
          if not report.critical_gates_passed:
              raise SystemExit('CRITICAL quality gates FAILED — see eval-report.txt')
          print('Critical quality gates PASSED.')
          "
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-eval-report
          path: eval-report.txt
      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit -r pyproject.toml 2>&1 || true
          # In CI, scan the installed project + all transitive deps:
          pip-audit 2>&1 || true
        continue-on-error: true
      - name: Docker build
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: false
          load: true

  api-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -e .
          which tesseract 2>/dev/null || echo "Tesseract not installed (expected in CI)"
      - name: Docker build (worker)
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile.worker
          push: false
          load: true

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - name: Reject unsafe raw HTML rendering of untrusted document content
        run: |
          if grep -R --line-number --include='*.tsx' --include='*.ts' "dangerouslySetInnerHTML" app components; then
            echo "dangerouslySetInnerHTML is forbidden in the tender UI: uploaded document text is untrusted."
            exit 1
          fi
      - run: npm run build
      - name: Docker build
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: false
          load: true
