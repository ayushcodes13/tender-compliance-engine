name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tce_ci
          POSTGRES_USER: tce
          POSTGRES_PASSWORD: tce-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tce -d tce_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: PostgreSQL migration + enum smoke
        env:
          DATABASE_URL: postgresql+asyncpg://tce:tce-password@localhost:5432/tce_ci
        run: |
          alembic -c alembic.ini upgrade head
          python - <<'PY'
          import asyncio
          import os

          from tender_compliance_api.db.models import Organization, Project, ProjectStatus
          from tender_compliance_api.db.session import close_engine, get_session, init_engine

          async def main() -> None:
              init_engine(os.environ["DATABASE_URL"])
              async for session in get_session():
                  org = Organization(name="CI PostgreSQL Smoke")
                  session.add(org)
                  await session.flush()
                  project = Project(
                      organization_id=org.id,
                      name="Enum serialization smoke",
                      status=ProjectStatus.DRAFT,
                  )
                  session.add(project)
                  await session.commit()
                  assert project.status == ProjectStatus.DRAFT
                  break
              await close_engine()

          asyncio.run(main())
          PY
      - run: ruff check .
      - run: pytest
      - name: Run benchmark evaluation harness — critical quality gates
        # Critical gates (invented-negative rate = 0, numeric fidelity = 0)
        # are BLOCKING — they guard against fabricated requirements and wrong
        # citations.  The aggregate F1 gate remains non-blocking because recall
        # is bounded by inherent deterministic-parser limitations (no bare-number
        # fabrication, no table-layout analysis, per-requirement rather than
        # cross-requirement context).  F1 is monitored in the eval report
        # artifact but does not block merge.  See docs/checkpoint.md CP48.
        run: |
          python -c "
          from tender_compliance_api.extraction.eval_harness import run_eval, format_text_report, check_quality_gates
          report = run_eval()
          text = format_text_report(report)
          with open('eval-report.txt', 'w') as f:
              f.write(text)
          print(text)
          print(f'CRITICAL GATES PASSED: {report.critical_gates_passed}')
          print(f'ALL GATES PASSED: {report.all_passed}')
          if not report.critical_gates_passed:
              raise SystemExit('CRITICAL quality gates FAILED — see eval-report.txt')
          print('Critical quality gates PASSED.')
          "
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-eval-report
          path: eval-report.txt
      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit -r pyproject.toml 2>&1 || true
          # In CI, scan the installed project + all transitive deps:
          pip-audit 2>&1 || true
        continue-on-error: true
      - name: Docker build
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: false
          load: true

  api-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -e .
          which tesseract 2>/dev/null || echo "Tesseract not installed (expected in CI)"
      - name: Docker build (worker)
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile.worker
          push: false
          load: true

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - name: Reject unsafe raw HTML rendering of untrusted document content
        run: |
          if grep -R --line-number --include='*.tsx' --include='*.ts' "dangerouslySetInnerHTML" app components; then
            echo "dangerouslySetInnerHTML is forbidden in the tender UI: uploaded document text is untrusted."
            exit 1
          fi
      - run: npm run build
      - name: Browser buyer-flow smoke
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Upload browser smoke report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
      - name: Docker build
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: false
          load: true

  pilot-smoke:
    name: bundled pilot smoke
    runs-on: ubuntu-latest
    needs: [api, api-worker, web]
    env:
      # Presence is required by production readiness, but the smoke never sends
      # document content to OpenAI.
      OPENAI_API_KEY: ci-placeholder-not-a-real-key
    steps:
      - uses: actions/checkout@v4
      - name: Verify one-key Compose contract
        run: |
          set -euo pipefail
          if OPENAI_API_KEY= docker compose config >/tmp/compose-empty.out 2>/tmp/compose-empty.err; then
            echo "Compose unexpectedly accepted an empty OPENAI_API_KEY."
            cat /tmp/compose-empty.out
            exit 1
          fi
          grep -q "OPENAI_API_KEY" /tmp/compose-empty.err
          docker compose config >/dev/null
      - name: Start product through the documented one-command handoff
        run: ./scripts/pilot-start.sh
      - name: Verify same-origin product readiness
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://localhost:3000/ >/dev/null
          curl --fail --silent --show-error http://localhost:3000/api/backend/ready -o /tmp/tce-ready.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("/tmp/tce-ready.json").read_text())
          assert data["status"] == "ready", data
          assert data["components"]["malware_scanner"] == "ready", data
          assert data["components"]["worker"] == "ready", data
          PY
          cat /tmp/tce-ready.json
          docker compose ps
      - name: Verify real malware scanner
        run: |
          set -euo pipefail
          docker compose exec -T api python - <<'PY'
          import asyncio

          from tender_compliance_api.routes.uploads import get_scanner

          EICAR = (
              b"X5O!P%@AP[4\\PZX54(P^)7CC)7}$EICAR-STANDARD-"
              b"ANTIVIRUS-TEST-FILE!$H+H*"
          )

          async def main() -> None:
              scanner = get_scanner()
              assert await scanner.ready()
              clean = await scanner.scan("clean.txt", b"tender compliance smoke")
              assert clean.clean is True
              infected = await scanner.scan("eicar.com", EICAR)
              assert infected.clean is False
              assert infected.threat_name

          asyncio.run(main())
          PY
      - name: Verify browser security headers
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -D /tmp/tce-headers -o /dev/null http://localhost:3000/
          tr -d '\r' < /tmp/tce-headers > /tmp/tce-headers-normalized
          grep -Eiq '^x-content-type-options: nosniff$' /tmp/tce-headers-normalized
          grep -Eiq '^x-frame-options: DENY$' /tmp/tce-headers-normalized
          grep -Eiq '^referrer-policy: strict-origin-when-cross-origin$' /tmp/tce-headers-normalized
          grep -Eiq '^permissions-policy: camera=\(\), microphone=\(\), geolocation=\(\)$' /tmp/tce-headers-normalized
      - name: Show bundled stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=250
      - name: Stop bundled product
        if: always()
        run: docker compose down -v --remove-orphans
