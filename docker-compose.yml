services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tce}
      POSTGRES_USER: ${POSTGRES_USER:-tce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tce-password}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tce} -d ${POSTGRES_DB:-tce}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10


  migrate:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tce}:${POSTGRES_PASSWORD:-tce-password}@postgres:5432/${POSTGRES_DB:-tce}
    command: alembic -c /app/alembic.ini upgrade head
    restart: "no"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      AUTH_MODE: single_workspace
      SINGLE_WORKSPACE_USER_ID: ${SINGLE_WORKSPACE_USER_ID:-00000000-0000-0000-0000-000000000001}
      SINGLE_WORKSPACE_ORG_ID: ${SINGLE_WORKSPACE_ORG_ID:-00000000-0000-0000-0000-000000000002}
      SINGLE_WORKSPACE_ORG_NAME: ${SINGLE_WORKSPACE_ORG_NAME:-Tender Compliance Workspace}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tce}:${POSTGRES_PASSWORD:-tce-password}@postgres:5432/${POSTGRES_DB:-tce}
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_LOCAL_PATH: /app/object-storage
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
    volumes:
      - object_data:/app/object-storage
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tce}:${POSTGRES_PASSWORD:-tce-password}@postgres:5432/${POSTGRES_DB:-tce}
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_LOCAL_PATH: /app/object-storage
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
    volumes:
      - object_data:/app/object-storage
    command: python -m tender_compliance_worker --max-concurrency ${MAX_CONCURRENCY:-4}

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/backend}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      BACKEND_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 10

volumes:
  pg_data:
  redis_data:
  object_data:
