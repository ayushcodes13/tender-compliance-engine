version: "3.9"

# =============================================================================
# Local deployment stack: postgres, redis, minio, api, worker, web.
# -----------------------------------------------------------------------------
# For local development only.  In production, provide environment configuration
# through your orchestration platform's secrets/config (see docs/runbooks/deployment.md).
# To override any value, create an `.env` file in the repository root — Docker
# Compose reads it automatically.  See `.env.example` for a template.
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tce
      POSTGRES_USER: tce
      POSTGRES_PASSWORD: tce-password
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tce -d tce"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-09-09T17-41-24Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tce-access-key
      MINIO_ROOT_PASSWORD: tce-secret-key
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://tce:tce-password@postgres:5432/tce
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: tce-access-key
      OBJECT_STORAGE_SECRET_KEY: tce-secret-key
      OBJECT_STORAGE_BUCKET: tender-documents
      OBJECT_STORAGE_REGION: us-east-1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      OPENAI_API_KEY:
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://tce:tce-password@postgres:5432/tce
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: tce-access-key
      OBJECT_STORAGE_SECRET_KEY: tce-secret-key
      OBJECT_STORAGE_BUCKET: tender-documents
      OBJECT_STORAGE_REGION: us-east-1
    restart: unless-stopped
    command: python -m tender_compliance_worker --max-concurrency 4

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      start-period: 10s
      retries: 3

volumes:
  pg_data:
  redis_data:
  minio_data:
