<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Tender Review workflow</title>
<desc id="desc">A text-based tender PDF is analyzed for source-linked requirements, checked against page citations and bounding boxes, then exported to a response sheet.</desc>
