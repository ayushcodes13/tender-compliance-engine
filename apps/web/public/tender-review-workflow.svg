<text x="72" y="160" fill="#1d2c29" font-family="Georgia, serif" font-size="48">From tender PDF to</text>
<text x="72" y="216" fill="#1d2c29" font-family="Georgia, serif" font-size="48">source-linked response sheet.</text>
<text x="72" y="262" fill="#5c6965" font-family="Arial, sans-serif" font-size="20">A focused review flow with citations, page boxes, and human checks.</text>
