  <rect x="8" y="8" width="80" height="80" rx="20" fill="url(#glass-hl)"/>
  <rect x="8" y="8" width="80" height="80" rx="20" fill="none" stroke="white" stroke-opacity="0.08" stroke-width="1"/>
  <!-- Document body -->
  <path d="M30 22 L57 22 L71 36 V70 C71 74.3 67.7 78 63 78 H30 C26.1 78 23 74.3 23 70 V30 C23 26.1 26.1 23 30 23 L30 22 Z" fill="white"/>
  <!-- Folded front flap -->
  <path d="M57 22 L71 36 H57 C56.1 36 56 35.1 56 35 V22 Z" fill="#E0E7FF"/>
  <!-- Compliance checkmark (trust blue) -->
  <path d="M35 49 L45 59 L61 43" stroke="#3b82f6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <defs>
    <linearGradient id="glass-hl" x1="0" y1="0" x2="0" y2="1">
